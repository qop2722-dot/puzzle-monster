name: Apply v0.6.1 UI

on:
  push:
    paths:
      - '.github/workflows/apply-v061-ui.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attach UI and effects
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'ui-v061.css' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="ui-v061.css?v=061">\n</head>')
          if 'fx-v061.js' not in s:
              s = s.replace('</body>', '<script src="fx-v061.js?v=061"></script>\n</body>')
          s = s.replace('拼圖怪獸戰場 v0.6</title>', '拼圖怪獸戰場 v0.6.1</title>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add index.html
            git commit -m "Enable v0.6.1 UI and battle effects"
            git push
          fi
