<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>拼圖怪獸戰場 v0.6.1</title>
<style>
:root{--cell:clamp(30px,min(14.4vw,calc((100dvh - 318px)/9)),50px);--bg:#07111f;--panel:#101b2e;--line:#ffffff1f;--muted:#93a4bb;--red:#ef4444;--blue:#3b82f6;--green:#22c55e;--yellow:#fbbf24}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at top,#1a3153 0,#07111f 58%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}button{font:inherit;color:inherit}.app{height:100dvh;max-width:620px;margin:auto;padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto 1fr auto;gap:7px;overflow:hidden}.top{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:start}.boss{background:linear-gradient(180deg,#1b2a43,#0d1728);border:1px solid var(--line);border-radius:16px;padding:9px;box-shadow:0 10px 24px #0005}.bossHead,.status,.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.bossName{font-weight:900;font-size:15px}.ver{font-size:10px;color:var(--muted);font-weight:600}.attack{font-size:12px;font-weight:800;color:#fed7aa;background:#f9731622;border:1px solid #fb923c55;border-radius:999px;padding:5px 8px;white-space:nowrap}.bar{height:9px;background:#ffffff14;border-radius:999px;overflow:hidden;margin-top:7px}.fill{height:100%;transition:width .25s}.bossFill{background:linear-gradient(90deg,#fb923c,#ef4444)}.playerFill{background:linear-gradient(90deg,#34d399,#14b8a6)}.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}.part{border:1px solid var(--line);background:#ffffff0b;border-radius:9px;min-height:34px;padding:4px;font-size:11px;font-weight:800}.part.selected{outline:2px solid var(--yellow);background:#fbbf2417}.part.dead{opacity:.35;filter:grayscale(1)}.restart{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;background:#ffffff0d;font-size:20px;font-weight:900}.status{background:#0d1728;border:1px solid var(--line);border-radius:14px;padding:7px 9px;min-height:43px}.stat{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800}.miniBar{width:94px;height:8px;background:#ffffff14;border-radius:999px;overflow:hidden}.combo{color:#fde68a;font-weight:900}.turn{color:var(--muted);font-size:11px}.shield{color:#93c5fd}.game{min-height:0;display:grid;place-items:center;position:relative}.boardwrap{position:relative;width:calc(var(--cell)*6);height:calc(var(--cell)*9);touch-action:none}.board{display:grid;grid-template-columns:repeat(6,var(--cell));grid-template-rows:repeat(9,var(--cell));width:100%;height:100%;background:#040a14;border:2px solid #ffffff24;border-radius:13px;overflow:hidden;box-shadow:0 14px 36px #0007}.cell{position:relative;border-right:1px solid #ffffff0d;border-bottom:1px solid #ffffff0d}.cell.filled:before,.ghostcell{content:"";position:absolute;inset:3px;border-radius:8px;box-shadow:inset 0 2px #ffffff3b,0 3px 8px #0007}.cell.red:before,.ghostcell.red{background:linear-gradient(145deg,#fb7185,#dc2626)}.cell.blue:before,.ghostcell.blue{background:linear-gradient(145deg,#60a5fa,#2563eb)}.cell.green:before,.ghostcell.green{background:linear-gradient(145deg,#4ade80,#16a34a)}.cell.stone:before{background:linear-gradient(145deg,#64748b,#111827);border:2px solid #94a3b8}.paw,.monster{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);font-size:calc(var(--cell)*.33)}.monster{font-size:calc(var(--cell)*.53);filter:drop-shadow(0 2px 2px #000)}.start,.bottom{position:absolute;left:0;right:0;z-index:5;pointer-events:none}.start{top:var(--cell);border-top:2px dashed #60a5fa99}.bottom{bottom:0;border-top:3px solid #f87171}.draglayer{position:absolute;inset:0;pointer-events:none;z-index:6}.ghostcell{position:absolute;width:var(--cell);height:var(--cell);opacity:.86;border:2px solid #fff}.bad{opacity:.25!important;filter:grayscale(1)}.handArea{background:linear-gradient(180deg,#17243a,#0c1626);border:1px solid var(--line);border-radius:16px;padding:7px}.handTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.handTitle{font-size:12px;font-weight:900}.selection{font-size:10px;color:var(--muted)}.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.piece{min-height:78px;border:1px solid var(--line);background:#ffffff0a;border-radius:12px;padding:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:none}.piece.selected{outline:3px solid #a78bfa;background:#8b5cf622}.pieceLabel{font-size:10px;color:#dbeafe;font-weight:800}.mini{display:grid;gap:2px;place-content:center;min-height:50px}.mc{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10px}.mc.red{background:var(--red)}.mc.blue{background:var(--blue)}.mc.green{background:var(--green)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.actions button{border:0;min-height:38px;border-radius:11px;font-weight:900;background:#ffffff14}.actions .main{background:linear-gradient(135deg,#8b5cf6,#6366f1)}.toast{position:fixed;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 145px);transform:translate(-50%,14px);z-index:20;max-width:88vw;padding:8px 11px;border-radius:999px;background:#020617e8;border:1px solid #ffffff28;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:#020617e6;display:grid;place-items:center;padding:22px;z-index:30}.hide{display:none}.modalBox{width:min(100%,330px);background:#101a2c;border:1px solid var(--line);border-radius:20px;padding:22px;text-align:center}.modalIcon{font-size:52px}.modalBox h2{margin:7px 0}.modalBox p{color:var(--muted);margin:0 0 15px}.wide{width:100%;min-height:44px;border:0;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#6366f1);font-weight:900}.boardwrap.hit{animation:shake .28s}.boardwrap.fire{animation:fire .45s}.boss.damaged{animation:bossHit .28s}.combo.flash{animation:comboFlash .45s}@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}@keyframes fire{45%{filter:brightness(1.7) saturate(1.8);box-shadow:0 0 28px #ef4444}}@keyframes bossHit{50%{transform:translateX(7px);filter:brightness(1.5)}}@keyframes comboFlash{50%{text-shadow:0 0 12px #fde68a;transform:scale(1.15)}}@media(max-height:650px){.app{gap:5px;padding-top:max(5px,env(safe-area-inset-top));padding-bottom:max(5px,env(safe-area-inset-bottom))}.boss{padding:7px}.parts{margin-top:5px}.piece{min-height:68px}.mini{min-height:42px}.mc{width:16px;height:16px}.actions button{min-height:34px}.status{min-height:38px;padding:5px 8px}}
</style>
<link rel="stylesheet" href="ui-v061.css?v=061">
</head>
<body>
<main class="app">
<section class="top"><div id="bossPanel" class="boss"><div class="bossHead"><div><span class="bossName">👑 沉沒之王</span> <span class="ver">v0.6</span></div><span id="attack" class="attack"></span></div><div class="bar"><div id="bossBar" class="fill bossFill"></div></div><div class="parts"><button id="partLeft" class="part">🦾 <span id="leftText"></span></button><button id="partCore" class="part selected">💠 <span id="coreText"></span></button><button id="partRight" class="part">🦾 <span id="rightText"></span></button></div></div><button id="restart" class="restart" aria-label="重新開始">↻</button></section>
<section class="status"><div class="stat">🛡️ <div class="miniBar"><div id="playerBar" class="fill playerFill"></div></div><span id="playerText"></span></div><div id="shieldText" class="stat shield"></div><div id="comboText" class="stat combo"></div><div id="turnText" class="turn"></div></section>
<section class="game"><div id="boardwrap" class="boardwrap"><div class="start"></div><div class="bottom"></div><div id="board" class="board"></div><div id="draglayer" class="draglayer"></div></div></section>
<section class="handArea"><div class="handTop"><span class="handTitle">三選一</span><span id="selectedText" class="selection"></span></div><div id="hand" class="hand"></div><div class="actions"><button id="rotate">↻ 旋轉</button><button id="cancel" class="main">取消</button></div></section>
</main>
<div id="toast" class="toast"></div><div id="modal" class="modal hide"><div class="modalBox"><div id="modalEmoji" class="modalIcon"></div><h2 id="modalTitle"></h2><p id="modalText"></p><button id="again" class="wide">再玩一次</button></div></div>
<script>
(()=>{'use strict';
const R=9,C=6,COLS=['red','blue','green'],N={red:'紅',blue:'藍',green:'綠'},M={red:'🦊',blue:'🐢',green:'🐰'};
const SH=[{n:'單格',c:[[0,0]]},{n:'雙格',c:[[0,0],[1,0]]},{n:'L形',c:[[0,0],[0,1],[1,1]]},{n:'直三',c:[[0,0],[1,0],[2,0]]},{n:'方形',c:[[0,0],[1,0],[0,1],[1,1]]},{n:'T形',c:[[0,0],[1,0],[2,0],[1,1]]}];
const $=id=>document.getElementById(id);let B,H,sel,turn,hp,shield,over,drag,combo,target,P,seen,uid,toastTimer;const rand=n=>Math.floor(Math.random()*n);
function empty(){return Array.from({length:R},()=>Array(C).fill(null))}function cell(color,mark=false,monster=null,stone=false){return{uid:++uid,color,mark,monster,stone}}function norm(a){const minX=Math.min(...a.map(v=>v[0])),minY=Math.min(...a.map(v=>v[1]));return a.map(v=>[v[0]-minX,v[1]-minY])}function rot(a){return norm(a.map(v=>[-v[1],v[0]]))}function piece(){const s=SH[rand(SH.length)],color=COLS[rand(3)],cells=s.c.map(v=>[...v]),marked=new Set(),count=rand(3);while(marked.size<Math.min(count,cells.length))marked.add(rand(cells.length));return{name:s.n,color,cells,marked}}
function seed(){for(let x=0;x<C;x++)if(Math.random()<.72)B[0][x]=cell(COLS[rand(3)],Math.random()<.18);for(let x=0;x<C;x++)if(Math.random()<.28)B[1][x]=cell(COLS[rand(3)]);[[0,0],[0,2],[0,4]].forEach(([y,x],i)=>{const color=COLS[i];if(!B[y][x])B[y][x]=cell(color,false,M[color]);else{B[y][x].color=color;B[y][x].monster=M[color]}})}
function init(){uid=0;B=empty();seed();H=[piece(),piece(),piece()];sel=null;turn=1;hp=260;shield=0;combo=0;target='core';P={left:{hp:120,max:120},core:{hp:620,max:620},right:{hp:120,max:120}};seen=new Set();over=false;drag=null;$('modal').classList.add('hide');note('戰鬥開始');render();window.__GAME_READY__=true}
function plan(t){if(t%6===0)return{t:'fire',i:'🔥',n:'火焰'};if(t%4===0)return{t:'quake',i:'💥',n:'地震'};if(t%5===0)return{t:'curse',i:'⬛',n:'詛咒'};return{t:'slash',i:'⚔️',n:'揮擊'}}
function render(){drawBoard();drawHand();const a=plan(turn);$('attack').textContent=`${a.i} ${a.n}`;$('bossBar').style.width=`${Math.max(0,P.core.hp)/P.core.max*100}%`;$('playerBar').style.width=`${Math.max(0,hp)/260*100}%`;$('playerText').textContent=`${Math.max(0,hp)}`;$('shieldText').textContent=`◆ ${shield}`;$('turnText').textContent=`T${turn}`;$('comboText').textContent=`×${combo}`;$('selectedText').textContent=sel==null?'':`${N[H[sel].color]}・${H[sel].name}`;$('leftText').textContent=Math.max(0,P.left.hp);$('coreText').textContent=Math.max(0,P.core.hp);$('rightText').textContent=Math.max(0,P.right.hp);['left','core','right'].forEach(id=>{const e=$('part'+id[0].toUpperCase()+id.slice(1));e.classList.toggle('selected',target===id);e.classList.toggle('dead',P[id].hp<=0)})}
function drawBoard(){const root=$('board');root.innerHTML='';for(let y=0;y<R;y++)for(let x=0;x<C;x++){const d=document.createElement('div'),v=B[y][x];d.className='cell';if(v){d.classList.add('filled',v.stone?'stone':v.color);if(v.mark&&!v.stone){const p=document.createElement('span');p.className='paw';p.textContent='🐾';d.appendChild(p)}if(v.monster&&!v.stone){const m=document.createElement('span');m.className='monster';m.textContent=v.monster;d.appendChild(m)}}root.appendChild(d)}}function bounds(a){return{w:Math.max(...a.map(v=>v[0]))+1,h:Math.max(...a.map(v=>v[1]))+1}}
function drawHand(){const root=$('hand');root.innerHTML='';H.forEach((p,i)=>{const b=bounds(p.cells),card=document.createElement('div'),mini=document.createElement('div');card.className='piece'+(i===sel?' selected':'');mini.className='mini';mini.style.gridTemplateColumns=`repeat(${b.w},18px)`;mini.style.gridTemplateRows=`repeat(${b.h},18px)`;for(let y=0;y<b.h;y++)for(let x=0;x<b.w;x++){const q=document.createElement('div'),k=p.cells.findIndex(v=>v[0]===x&&v[1]===y);if(k>=0){q.className=`mc ${p.color}`;if(p.marked.has(k))q.textContent='🐾'}mini.appendChild(q)}const label=document.createElement('div');label.className='pieceLabel';label.textContent=`${N[p.color]}・${p.name}`;card.append(mini,label);card.addEventListener('pointerdown',e=>start(e,i));card.addEventListener('click',()=>{sel=i;render()});root.appendChild(card)})}
function can(p,gx,gy){return p.cells.every(([dx,dy])=>{const x=gx+dx,y=gy+dy;return x>=0&&x<C&&y>=0&&y<R&&!B[y][x]})}
function place(i,gx,gy){const p=H[i];if(!can(p,gx,gy)){note('放不下');return false}p.cells.forEach(([dx,dy],k)=>B[gy+dy][gx+dx]=cell(p.color,p.marked.has(k)));H=[piece(),piece(),piece()];sel=null;const made=patterns();combo=made?combo+1:0;if(made)flashCombo();sink();boss();turn++;end();render();return true}
function start(e,i){if(over)return;sel=i;drag={id:e.pointerId,i,moved:false};e.preventDefault();show(e.clientX,e.clientY);window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',drop,{once:true});render()}
function grid(cx,cy,p){const r=$('boardwrap').getBoundingClientRect(),z=r.width/C,b=bounds(p.cells);return{x:Math.round((cx-r.left)/z-b.w/2),y:Math.round((cy-r.top)/z-b.h/2),inside:cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom}}
function show(cx,cy){if(!drag)return;const p=H[drag.i],g=grid(cx,cy,p),layer=$('draglayer'),z=$('boardwrap').clientWidth/C,ok=g.inside&&can(p,g.x,g.y);layer.innerHTML='';if(g.inside)p.cells.forEach(([dx,dy],k)=>{const d=document.createElement('div');d.className=`ghostcell ${p.color}${ok?'':' bad'}`;d.style.left=`${(g.x+dx)*z}px`;d.style.top=`${(g.y+dy)*z}px`;if(p.marked.has(k))d.textContent='🐾';layer.appendChild(d)});drag.g=g;drag.ok=ok}
function move(e){if(!drag)return;e.preventDefault();drag.moved=true;show(e.clientX,e.clientY)}function drop(){window.removeEventListener('pointermove',move);$('draglayer').innerHTML='';const d=drag;drag=null;if(d?.g?.inside&&d.ok)place(d.i,d.g.x,d.g.y);else{sel=d?.i??sel;render()}}
function fresh(type,a){const k=type+':'+a.map(([y,x])=>B[y][x].uid).sort((a,b)=>a-b).join(',');if(seen.has(k))return false;seen.add(k);return true}function bonus(color,a){return a.some(([y,x])=>B[y][x]?.monster===M[color])?1.5:1}
function hit(raw){const id=P[target].hp>0?target:'core',mul=Math.min(3,1+combo*.25),damage=Math.round(raw*mul);P[id].hp=Math.max(0,P[id].hp-damage);note(`-${damage}`);const boss=$('bossPanel');boss.classList.remove('damaged');void boss.offsetWidth;boss.classList.add('damaged');setTimeout(()=>boss.classList.remove('damaged'),350)}
function patterns(){let count=0;for(const color of COLS){for(let y=0;y<R;y++)for(let x=0;x<C;x++){if(x<=C-3){const a=[[y,x],[y,x+1],[y,x+2]];if(a.every(([r,c])=>B[r][c]?.color===color)&&fresh('line',a)){const marks=a.reduce((s,[r,c])=>s+(B[r][c].mark?1:0),0);hit((12+marks*3)*bonus(color,a));count++}}if(y<=R-3){const a=[[y,x],[y+1,x],[y+2,x]];if(a.every(([r,c])=>B[r][c]?.color===color)&&fresh('line',a)){const marks=a.reduce((s,[r,c])=>s+(B[r][c].mark?1:0),0);hit((12+marks*3)*bonus(color,a));count++}}}if(color==='blue')for(let y=0;y<R-1;y++)for(let x=0;x<C-1;x++){const a=[[y,x],[y,x+1],[y+1,x],[y+1,x+1]];if(a.every(([r,c])=>B[r][c]?.color==='blue')&&fresh('square',a)){shield=Math.min(160,shield+Math.round(18*bonus('blue',a)));count++}}if(color==='green')for(let y=1;y<R-1;y++)for(let x=1;x<C-1;x++){const a=[[y,x],[y-1,x],[y+1,x],[y,x-1],[y,x+1]];if(a.every(([r,c])=>B[r][c]?.color==='green')&&fresh('cross',a)){hp=Math.min(260,hp+Math.round(24*bonus('green',a)));count++}}}if(!count)note('Combo 中斷');return count>0}
function sink(){const lost=B[R-1].filter(Boolean).length;for(let y=R-1;y>0;y--)B[y]=B[y-1].map(v=>v?{...v}:null);B[0]=Array(C).fill(null);if(lost){const damage=lost*7;hp-=damage;note(`沉沒 -${damage}`)}}function occupied(includeStone=false){const a=[];for(let y=0;y<R;y++)for(let x=0;x<C;x++)if(B[y][x]&&(includeStone||!B[y][x].stone))a.push([y,x]);return a}function clear(y,x){if(B[y]?.[x]){B[y][x]=null;return 1}return 0}
function effect(name){const e=$('boardwrap');e.classList.remove('hit','fire');void e.offsetWidth;e.classList.add(name);setTimeout(()=>e.classList.remove(name),500)}
function boss(){if(P.core.hp<=0)return;const a=plan(turn);let removed=0,damage=0;if(a.t==='slash'){const o=occupied();if(o.length){const [y,x]=o[rand(o.length)];removed=clear(y,x)}damage=(P.left.hp<=0?8:14)+rand(5);effect('hit')}else if(a.t==='quake'){const y=rand(R-1),x=rand(C-1);for(let yy=y;yy<y+2;yy++)for(let xx=x;xx<x+2;xx++)removed+=clear(yy,xx);damage=P.right.hp<=0?20:34;effect('hit')}else if(a.t==='fire'){const y=rand(R);for(let x=0;x<C;x++)removed+=clear(y,x);damage=P.right.hp<=0?22:38;effect('fire')}else{const spaces=[];for(let y=0;y<R;y++)for(let x=0;x<C;x++)if(!B[y][x])spaces.push([y,x]);const all=occupied(true),spot=spaces.length?spaces[rand(spaces.length)]:(all.length?all[rand(all.length)]:null);if(spot)B[spot[0]][spot[1]]=cell(null,false,null,true);damage=P.left.hp<=0?7:12;effect('hit')}seen=new Set();const blocked=Math.min(shield,damage);shield-=blocked;damage-=blocked;hp-=damage;note(`${a.i} -${damage}${removed?` / ${removed}格`:''}`)}
function end(){if(P.core.hp<=0)finish(true);else if(hp<=0)finish(false)}function finish(win){over=true;$('modal').classList.remove('hide');$('modalEmoji').textContent=win?'🏆':'💥';$('modalTitle').textContent=win?'勝利':'失敗';$('modalText').textContent=win?`第 ${turn} 回合`:'玩家 HP 歸零'}function note(text){clearTimeout(toastTimer);const t=$('toast');t.textContent=text;t.classList.add('show');toastTimer=setTimeout(()=>t.classList.remove('show'),900)}function flashCombo(){const e=$('comboText');e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),500)}
$('rotate').onclick=()=>{if(sel==null)return note('先選方塊');H[sel].cells=rot(H[sel].cells);render()};$('cancel').onclick=()=>{sel=null;$('draglayer').innerHTML='';render()};$('restart').onclick=init;$('again').onclick=init;$('partLeft').onclick=()=>{if(P.left.hp>0)target='left';render()};$('partCore').onclick=()=>{target='core';render()};$('partRight').onclick=()=>{if(P.right.hp>0)target='right';render()};init();
})();
</script>

</body>
