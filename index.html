<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0f172a"><title>拼圖怪獸戰場 v0.5</title><style>:root{--c:min(11.8vw,54px);--bg:#07111f;--p:#111c2f;--l:#ffffff1f;--m:#9fb0c7;--r:#ef4444;--b:#3b82f6;--g:#22c55e}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#1b3151,#07111f 55%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}body{overscroll-behavior:none}.app{max-width:620px;margin:auto;padding:max(12px,env(safe-area-inset-top)) 12px max(28px,env(safe-area-inset-bottom))}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.card{background:linear-gradient(#192840,#0d182a);border:1px solid var(--l);border-radius:17px;padding:11px;margin-bottom:9px;box-shadow:0 12px 28px #0005}.tiny{font-size:12px;color:var(--m)}h1{font-size:22px;margin:0}button{font:inherit;color:inherit}.ghost{border:1px solid var(--l);background:#ffffff0c;padding:9px;border-radius:11px}.avatar{font-size:38px}.grow{flex:1}.bar{height:10px;background:#ffffff14;border-radius:999px;overflow:hidden;margin:6px 0}.fill{height:100%;transition:width .25s}.bossfill{background:linear-gradient(90deg,#fb923c,#ef4444)}.playerfill{background:linear-gradient(90deg,#22c55e,#14b8a6)}.mode{font-size:12px;padding:5px 8px;border-radius:999px;background:#f59e0b24;border:1px solid #f59e0b55;color:#fde68a}.hint{margin-top:8px;padding:8px;border-radius:11px;background:#ef44441a;border:1px solid #ef444455;color:#fecaca;font-size:12px}.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.part{border:1px solid var(--l);background:#ffffff0b;border-radius:11px;padding:7px;text-align:center}.part.selected{outline:2px solid #fbbf24}.part.dead{opacity:.35}.part strong,.part span{display:block;font-size:11px}.boardwrap{position:relative;width:calc(var(--c)*6);height:calc(var(--c)*9);margin:9px auto;touch-action:none}.board{display:grid;grid-template-columns:repeat(6,var(--c));grid-template-rows:repeat(9,var(--c));width:100%;height:100%;background:#050c17;border:2px solid var(--l);border-radius:12px;overflow:hidden}.cell{position:relative;border-right:1px solid #ffffff0d;border-bottom:1px solid #ffffff0d}.cell.filled:before,.ghostcell{content:"";position:absolute;inset:3px;border-radius:8px;box-shadow:inset 0 2px #ffffff35,0 3px 8px #0007}.cell.red:before,.ghostcell.red{background:linear-gradient(145deg,#fb7185,#dc2626)}.cell.blue:before,.ghostcell.blue{background:linear-gradient(145deg,#60a5fa,#2563eb)}.cell.green:before,.ghostcell.green{background:linear-gradient(145deg,#4ade80,#16a34a)}.cell.stone:before{background:linear-gradient(145deg,#64748b,#111827);border:2px solid #94a3b8}.paw,.monster{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);font-size:calc(var(--c)*.35)}.monster{font-size:calc(var(--c)*.55)}.start,.bottom{position:absolute;left:0;right:0;z-index:4;pointer-events:none}.start{top:var(--c);border-top:2px dashed #60a5facc}.bottom{bottom:0;border-top:3px solid #f87171}.start span,.bottom span{position:absolute;right:3px;top:-17px;font-size:10px;background:#07111f;padding:1px 4px}.draglayer{position:absolute;inset:0;pointer-events:none}.ghostcell{position:absolute;width:var(--c);height:var(--c);opacity:.82;border:2px solid #fff}.bad{opacity:.3!important;filter:grayscale(1)}.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.piece{min-height:102px;border:1px solid var(--l);background:#ffffff0b;border-radius:13px;padding:7px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;touch-action:none}.piece.selected{outline:3px solid #a78bfa}.mini{display:grid;gap:3px;place-content:center;min-height:62px}.mc{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px}.mc.red{background:var(--r)}.mc.blue{background:var(--b)}.mc.green{background:var(--g)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.controls button,.wide{border:0;min-height:44px;border-radius:12px;font-weight:800;background:#ffffff14}.controls .main,.wide{background:linear-gradient(135deg,#8b5cf6,#6366f1)}.log{display:flex;flex-direction:column;gap:5px;max-height:160px;overflow:auto;margin-top:7px}.entry{font-size:12px;background:#ffffff0a;padding:6px 8px;border-radius:8px}.combo{color:#fde68a;font-weight:800}.modal{position:fixed;inset:0;background:#020617dd;display:grid;place-items:center;padding:22px;z-index:20}.hide{display:none}.modal>div{width:min(100%,350px);background:#101a2c;border:1px solid var(--l);border-radius:19px;padding:20px;text-align:center}.boardwrap.hit{animation:shake .28s}.boardwrap.fire{animation:fire .45s}@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}@keyframes fire{45%{filter:brightness(1.7) saturate(1.8);box-shadow:0 0 26px #ef4444}}@media(min-width:560px){:root{--c:56px}}</style></head><body><main class="app"><header class="row" style="margin-bottom:9px"><div><div class="tiny">手機測試版 v0.5</div><h1>拼圖怪獸戰場</h1></div><button id="restart" class="ghost">重新開始</button></header><section class="card"><div class="row"><div class="avatar">👑</div><div class="grow"><div class="row"><strong>沉沒之王</strong><span id="bossMode" class="mode"></span></div><div class="bar"><div id="bossBar" class="fill bossfill"></div></div><div id="bossText" class="tiny"></div></div></div><div id="hint" class="hint"></div><div class="parts"><button id="partLeft" class="part"><strong>🦾 左臂</strong><span id="leftText"></span></button><button id="partCore" class="part selected"><strong>💠 核心</strong><span id="coreText"></span></button><button id="partRight" class="part"><strong>🦾 右臂</strong><span id="rightText"></span></button></div></section><section class="card"><div class="row"><div class="avatar">🛡️</div><div class="grow"><div class="row"><strong>玩家總血量</strong><span id="turnText" class="tiny"></span></div><div class="bar"><div id="playerBar" class="fill playerfill"></div></div><div class="row tiny"><span id="playerText"></span><span id="shieldText"></span></div></div></div><div class="row" style="margin-top:7px"><span class="tiny">連續完成新圖形可提高傷害</span><span id="comboText" class="combo"></span></div></section><section class="card"><div class="row"><div><strong>下沉戰場</strong><div class="tiny">王會破壞方塊；補回圖形可再次觸發</div></div><span id="overflow" class="mode"></span></div><div id="boardwrap" class="boardwrap"><div class="start"><span>初始線</span></div><div class="bottom"><span>沉沒線</span></div><div id="board" class="board"></div><div id="draglayer" class="draglayer"></div></div></section><section class="card"><div class="row"><div><strong>本回合三選一</strong><div class="tiny">拖曳到棋盤；選中後可旋轉</div></div><span id="selectedText" class="tiny"></span></div><div id="hand" class="hand"></div><div class="controls"><button id="rotate">↻ 旋轉</button><button id="cancel" class="main">取消選擇</button></div></section><section class="card tiny">王會提前預告下一招：揮擊消除單格、地震消除 2×2、火焰吐息清除整列、岩石詛咒製造黑色障礙。破壞左右手可降低部分攻擊傷害。</section><section class="card"><strong>戰鬥紀錄</strong><div id="log" class="log"></div></section></main><div id="modal" class="modal hide"><div><div id="modalEmoji" style="font-size:50px"></div><h2 id="modalTitle"></h2><p id="modalText" class="tiny"></p><button id="again" class="wide">再玩一次</button></div></div><script>(()=>{'use strict';const R=9,C=6,COLS=['red','blue','green'],N={red:'紅',blue:'藍',green:'綠'},M={red:'🦊',blue:'🐢',green:'🐰'},SH=[{n:'單格',c:[[0,0]]},{n:'雙格',c:[[0,0],[1,0]]},{n:'L形',c:[[0,0],[0,1],[1,1]]},{n:'直三',c:[[0,0],[1,0],[2,0]]},{n:'方形',c:[[0,0],[1,0],[0,1],[1,1]]},{n:'T形',c:[[0,0],[1,0],[2,0],[1,1]]}];const $=x=>document.getElementById(x);let B,H,sel,turn,hp,shield,over,drag,combo,target,P,seen,uid;const rand=n=>Math.floor(Math.random()*n);function empty(){return Array.from({length:R},()=>Array(C).fill(null))}function cell(color,mark=false,monster=null,stone=false){return{uid:++uid,color,mark,monster,stone}}function norm(a){let x=Math.min(...a.map(v=>v[0])),y=Math.min(...a.map(v=>v[1]));return a.map(v=>[v[0]-x,v[1]-y])}function rot(a){return norm(a.map(v=>[-v[1],v[0]]))}function piece(){let s=SH[rand(SH.length)],color=COLS[rand(3)],a=s.c.map(v=>[...v]),marked=new Set(),k=rand(3);while(marked.size<Math.min(k,a.length))marked.add(rand(a.length));return{name:s.n,color,cells:a,marked}}function seed(){for(let x=0;x<C;x++)if(Math.random()<.72)B[0][x]=cell(COLS[rand(3)],Math.random()<.18);for(let x=0;x<C;x++)if(Math.random()<.28)B[1][x]=cell(COLS[rand(3)]);[[0,0],[0,2],[0,4]].forEach(([y,x],i)=>{let color=COLS[i];if(!B[y][x])B[y][x]=cell(color,false,M[color]);else{B[y][x].color=color;B[y][x].monster=M[color]}})}function init(){uid=0;B=empty();seed();H=[piece(),piece(),piece()];sel=null;turn=1;hp=260;shield=0;combo=0;target='core';P={left:{hp:120,max:120},core:{hp:620,max:620},right:{hp:120,max:120}};seen=new Set();over=false;drag=null;$('log').innerHTML='';$('modal').classList.add('hide');log('戰鬥開始：三隻怪獸已部署。');render()}function plan(t){if(t%6===0)return{t:'fire',i:'🔥',n:'火焰吐息',d:'清除隨機一整列'};if(t%4===0)return{t:'quake',i:'💥',n:'地震',d:'清除隨機 2×2'};if(t%5===0)return{t:'curse',i:'⬛',n:'岩石詛咒',d:'製造黑色石塊'};return{t:'slash',i:'⚔️',n:'王之揮擊',d:'消除隨機一格'}}function render(){drawBoard();drawHand();let a=plan(turn);$('bossMode').textContent=a.n;$('hint').textContent=`下一招：${a.i} ${a.n}｜${a.d}`;$('bossBar').style.width=`${Math.max(0,P.core.hp)/P.core.max*100}%`;$('bossText').textContent=`核心 HP ${Math.max(0,P.core.hp)} / ${P.core.max}`;$('playerBar').style.width=`${Math.max(0,hp)/260*100}%`;$('playerText').textContent=`HP ${Math.max(0,hp)} / 260`;$('shieldText').textContent=`護盾 ${shield}`;$('turnText').textContent=`第 ${turn} 回合`;$('comboText').textContent=`Combo ${combo}`;$('selectedText').textContent=sel==null?'尚未選擇':`${N[H[sel].color]}色・${H[sel].name}`;$('leftText').textContent=`${Math.max(0,P.left.hp)} / 120`;$('coreText').textContent=`${Math.max(0,P.core.hp)} / 620`;$('rightText').textContent=`${Math.max(0,P.right.hp)} / 120`;['left','core','right'].forEach(id=>{let e=$('part'+id[0].toUpperCase()+id.slice(1));e.classList.toggle('selected',target===id);e.classList.toggle('dead',P[id].hp<=0)})}function drawBoard(){let e=$('board');e.innerHTML='';for(let y=0;y<R;y++)for(let x=0;x<C;x++){let d=document.createElement('div'),v=B[y][x];d.className='cell';if(v){d.classList.add('filled',v.stone?'stone':v.color);if(v.mark&&!v.stone){let p=document.createElement('span');p.className='paw';p.textContent='🐾';d.appendChild(p)}if(v.monster&&!v.stone){let m=document.createElement('span');m.className='monster';m.textContent=v.monster;d.appendChild(m)}}e.appendChild(d)}}function bounds(a){return{w:Math.max(...a.map(v=>v[0]))+1,h:Math.max(...a.map(v=>v[1]))+1}}function drawHand(){let e=$('hand');e.innerHTML='';H.forEach((p,i)=>{let b=bounds(p.cells),d=document.createElement('div'),mini=document.createElement('div');d.className='piece'+(i===sel?' selected':'');mini.className='mini';mini.style.gridTemplateColumns=`repeat(${b.w},22px)`;mini.style.gridTemplateRows=`repeat(${b.h},22px)`;for(let y=0;y<b.h;y++)for(let x=0;x<b.w;x++){let q=document.createElement('div'),k=p.cells.findIndex(v=>v[0]===x&&v[1]===y);if(k>=0){q.className=`mc ${p.color}`;if(p.marked.has(k))q.textContent='🐾'}mini.appendChild(q)}d.innerHTML=`<div class="tiny">${N[p.color]}色・${p.name}</div>`;d.appendChild(mini);d.insertAdjacentHTML('beforeend','<div class="tiny">拖到棋盤</div>');d.addEventListener('pointerdown',ev=>start(ev,i));d.addEventListener('click',()=>{sel=i;render()});e.appendChild(d)})}function can(p,gx,gy){return p.cells.every(([dx,dy])=>{let x=gx+dx,y=gy+dy;return x>=0&&x<C&&y>=0&&y<R&&!B[y][x]})}function place(i,gx,gy){let p=H[i];if(!can(p,gx,gy)){log('這個位置放不下。');return}p.cells.forEach(([dx,dy],k)=>B[gy+dy][gx+dx]=cell(p.color,p.marked.has(k)));H=[piece(),piece(),piece()];sel=null;let ok=patterns();combo=ok?combo+1:0;sink();boss();turn++;end();render()}function start(e,i){if(over)return;sel=i;drag={id:e.pointerId,i};e.preventDefault();show(e.clientX,e.clientY);window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',drop,{once:true});render()}function grid(cx,cy,p){let r=$('boardwrap').getBoundingClientRect(),z=r.width/C,b=bounds(p.cells);return{x:Math.round((cx-r.left)/z-b.w/2),y:Math.round((cy-r.top)/z-b.h/2)}}function show(cx,cy){if(!drag)return;let p=H[drag.i],g=grid(cx,cy,p),l=$('draglayer'),z=$('boardwrap').clientWidth/C,ok=can(p,g.x,g.y);l.innerHTML='';p.cells.forEach(([dx,dy],k)=>{let d=document.createElement('div');d.className=`ghostcell ${p.color}${ok?'':' bad'}`;d.style.left=`${(g.x+dx)*z}px`;d.style.top=`${(g.y+dy)*z}px`;if(p.marked.has(k))d.textContent='🐾';l.appendChild(d)});drag.g=g}function move(e){if(!drag)return;e.preventDefault();show(e.clientX,e.clientY)}function drop(){window.removeEventListener('pointermove',move);$('draglayer').innerHTML='';if(drag?.g)place(drag.i,drag.g.x,drag.g.y);drag=null}function fresh(t,a){let k=t+':'+a.map(([y,x])=>B[y][x].uid).sort((a,b)=>a-b).join(',');if(seen.has(k))return false;seen.add(k);return true}function bonus(color,a){return a.some(([y,x])=>B[y][x]?.monster===M[color])?1.5:1}function hit(raw){let id=P[target].hp>0?target:'core',mul=Math.min(3,1+combo*.25),d=Math.round(raw*mul);P[id].hp=Math.max(0,P[id].hp-d);log(`${id==='core'?'核心':id==='left'?'左臂':'右臂'}受到 ${d} 傷害。`);if(P[id].hp===0&&id!=='core')log(`${id==='left'?'左臂':'右臂'}已破壞。`)}function patterns(){let n=0;for(let color of COLS){for(let y=0;y<R;y++)for(let x=0;x<C;x++){if(x<=C-3){let a=[[y,x],[y,x+1],[y,x+2]];if(a.every(([r,c])=>B[r][c]?.color===color)&&fresh('l',a)){let m=a.reduce((s,[r,c])=>s+(B[r][c].mark?1:0),0);hit((12+m*3)*bonus(color,a));n++}}if(y<=R-3){let a=[[y,x],[y+1,x],[y+2,x]];if(a.every(([r,c])=>B[r][c]?.color===color)&&fresh('l',a)){let m=a.reduce((s,[r,c])=>s+(B[r][c].mark?1:0),0);hit((12+m*3)*bonus(color,a));n++}}}if(color==='blue')for(let y=0;y<R-1;y++)for(let x=0;x<C-1;x++){let a=[[y,x],[y,x+1],[y+1,x],[y+1,x+1]];if(a.every(([r,c])=>B[r][c]?.color==='blue')&&fresh('s',a)){let g=Math.round(18*bonus('blue',a));shield=Math.min(160,shield+g);log(`藍色方陣增加 ${g} 護盾。`);n++}}if(color==='green')for(let y=1;y<R-1;y++)for(let x=1;x<C-1;x++){let a=[[y,x],[y-1,x],[y+1,x],[y,x-1],[y,x+1]];if(a.every(([r,c])=>B[r][c]?.color==='green')&&fresh('c',a)){let h=Math.round(24*bonus('green',a)),real=Math.min(260-hp,h);hp+=real;log(`綠色十字回復 ${real}。`);n++}}}if(!n)log('沒有完成新圖形，Combo 中斷。');return n>0}function sink(){let lost=B[R-1].filter(Boolean).length;for(let y=R-1;y>0;y--)B[y]=B[y-1].map(v=>v?{...v}:null);B[0]=Array(C).fill(null);let d=lost*7;if(d){hp-=d;log(`${lost} 格沉沒，受到 ${d} 傷害。`)}$('overflow').textContent=`沉沒傷害 ${d}`}function occ(all=false){let a=[];for(let y=0;y<R;y++)for(let x=0;x<C;x++)if(B[y][x]&&(all||!B[y][x].stone))a.push([y,x]);return a}function clear(y,x){if(B[y]?.[x]){B[y][x]=null;return 1}return 0}function fx(c){let e=$('boardwrap');e.classList.remove('hit','fire');void e.offsetWidth;e.classList.add(c);setTimeout(()=>e.classList.remove(c),500)}function boss(){if(P.core.hp<=0)return;let a=plan(turn),removed=0,d=0;if(a.t==='slash'){let o=occ();if(o.length){let [y,x]=o[rand(o.length)];removed=clear(y,x)}d=(P.left.hp<=0?8:14)+rand(5);fx('hit')}else if(a.t==='quake'){let y=rand(R-1),x=rand(C-1);for(let yy=y;yy<y+2;yy++)for(let xx=x;xx<x+2;xx++)removed+=clear(yy,xx);d=P.right.hp<=0?20:34;fx('hit')}else if(a.t==='fire'){let y=rand(R);for(let x=0;x<C;x++)removed+=clear(y,x);d=P.right.hp<=0?22:38;fx('fire')}else{let e=[];for(let y=0;y<R;y++)for(let x=0;x<C;x++)if(!B[y][x])e.push([y,x]);let o=e.length?e[rand(e.length)]:occ(true)[rand(occ(true).length)];if(o)B[o[0]][o[1]]=cell(null,false,null,true);d=P.left.hp<=0?7:12;fx('hit')}seen=new Set();let b=Math.min(shield,d);shield-=b;d-=b;hp-=d;log(`${a.n}：破壞 ${removed} 格，護盾抵擋 ${b}，受到 ${d} 傷害。`)}function end(){if(P.core.hp<=0)finish(true);else if(hp<=0)finish(false)}function finish(win){over=true;$('modal').classList.remove('hide');$('modalEmoji').textContent=win?'🏆':'💥';$('modalTitle').textContent=win?'擊敗沉沒之王':'玩家全隊倒下';$('modalText').textContent=win?`第 ${turn} 回合獲勝。`:'玩家總血量歸零。'}function log(t){let d=document.createElement('div');d.className='entry';d.textContent=t;$('log').prepend(d)}$('rotate').onclick=()=>{if(sel==null)return log('請先選擇手牌。');H[sel].cells=rot(H[sel].cells);render()};$('cancel').onclick=()=>{sel=null;$('draglayer').innerHTML='';render()};$('restart').onclick=init;$('again').onclick=init;$('partLeft').onclick=()=>{if(P.left.hp>0)target='left';render()};$('partCore').onclick=()=>{target='core';render()};$('partRight').onclick=()=>{if(P.right.hp>0)target='right';render()};init()})();</script></body></html>
