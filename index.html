<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0f172a" />
<title>拼圖怪獸戰場 v0.3</title>
<style>
:root{--bg:#07111f;--panel:#111c2f;--panel2:#18263d;--line:rgba(255,255,255,.12);--text:#f8fafc;--muted:#9fb0c7;--red:#ef4444;--blue:#3b82f6;--green:#22c55e;--yellow:#f59e0b;--cell:min(11.8vw,54px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#1b3151 0,#07111f 50%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}body{overscroll-behavior:none}.app{width:min(100%,620px);margin:auto;padding:max(12px,env(safe-area-inset-top)) 12px max(28px,env(safe-area-inset-bottom))}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.card{background:linear-gradient(180deg,rgba(25,40,64,.97),rgba(13,24,42,.97));border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.28)}header{margin-bottom:10px}h1{font-size:22px;margin:0}.tiny{font-size:12px;color:var(--muted)}button{font:inherit;color:inherit}.ghost{border:1px solid var(--line);background:rgba(255,255,255,.05);padding:9px 11px;border-radius:12px}.boss,.player{padding:12px;margin-bottom:9px}.avatar{font-size:40px;width:48px;text-align:center}.grow{flex:1}.bar{height:11px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin:7px 0 3px}.fill{height:100%;transition:width .25s}.bossfill{background:linear-gradient(90deg,#f97316,#ef4444)}.playerfill{background:linear-gradient(90deg,#22c55e,#14b8a6)}.shieldfill{background:#60a5fa}.mode{padding:5px 9px;border-radius:999px;background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.35);color:#fde68a;font-size:12px}.boardcard{padding:10px;margin-bottom:9px}.boardwrap{position:relative;width:calc(var(--cell)*6);height:calc(var(--cell)*9);margin:10px auto 2px;touch-action:none}.board{display:grid;grid-template-columns:repeat(6,var(--cell));grid-template-rows:repeat(9,var(--cell));width:100%;height:100%;background:#050c17;border:2px solid rgba(255,255,255,.14);border-radius:12px;overflow:hidden}.cell{position:relative;border-right:1px solid rgba(255,255,255,.055);border-bottom:1px solid rgba(255,255,255,.055)}.cell.filled:before,.ghostcell{content:"";position:absolute;inset:3px;border-radius:8px;box-shadow:inset 0 2px 0 rgba(255,255,255,.22),0 3px 8px rgba(0,0,0,.28)}.cell.red:before,.ghostcell.red{background:linear-gradient(145deg,#fb7185,#dc2626)}.cell.blue:before,.ghostcell.blue{background:linear-gradient(145deg,#60a5fa,#2563eb)}.cell.green:before,.ghostcell.green{background:linear-gradient(145deg,#4ade80,#16a34a)}.paw{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);font-size:calc(var(--cell)*.36)}.startline{position:absolute;left:0;right:0;top:calc(var(--cell)*1);z-index:4;border-top:2px dashed rgba(96,165,250,.8);pointer-events:none}.startline span,.bottomline span{position:absolute;right:4px;top:-17px;font-size:10px;background:#07111f;padding:1px 4px}.bottomline{position:absolute;left:0;right:0;bottom:0;z-index:4;border-top:3px solid rgba(248,113,113,.95);pointer-events:none}.bottomline span{color:#fecaca}.draglayer{position:absolute;inset:0;pointer-events:none}.ghostcell{position:absolute;width:var(--cell);height:var(--cell);opacity:.82;border:2px solid white}.bad{filter:grayscale(.3);opacity:.35!important}.handcard{padding:11px;margin-bottom:9px}.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}.piece{min-height:104px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:14px;padding:7px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;touch-action:none}.piece.selected{outline:3px solid #a78bfa;background:rgba(139,92,246,.14)}.mini{display:grid;gap:3px;place-content:center;min-height:64px}.minicell{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px}.minicell.red{background:var(--red)}.minicell.blue{background:var(--blue)}.minicell.green{background:var(--green)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.controls button{border:0;min-height:46px;border-radius:13px;font-weight:800;background:rgba(255,255,255,.08)}.controls .main{background:linear-gradient(135deg,#8b5cf6,#6366f1)}.rules{padding:10px 12px;margin-bottom:9px;font-size:12px;color:#d6dfeb;line-height:1.55}.logcard{padding:11px}.log{display:flex;flex-direction:column;gap:5px;max-height:150px;overflow:auto;margin-top:7px}.entry{font-size:12px;background:rgba(255,255,255,.04);padding:6px 8px;border-radius:8px}.modal{position:fixed;inset:0;z-index:20;background:rgba(2,6,23,.8);display:grid;place-items:center;padding:24px}.modal.hide{display:none}.modalbox{width:min(100%,360px);padding:22px;text-align:center;background:#101a2c;border-radius:20px;border:1px solid var(--line)}.wide{width:100%;padding:13px;border:0;border-radius:13px;background:#6366f1;font-weight:800}@media(min-width:560px){:root{--cell:56px}}
</style>
</head>
<body><main class="app">
<header class="row"><div><div class="tiny">手機測試版 v0.3</div><h1>拼圖怪獸戰場</h1></div><button id="restart" class="ghost">重新開始</button></header>
<section class="boss card"><div class="row"><div class="avatar">👑</div><div class="grow"><div class="row"><strong>沉沒之王</strong><span id="bossMode" class="mode">普通攻擊</span></div><div class="bar"><div id="bossBar" class="fill bossfill"></div></div><div id="bossText" class="tiny"></div></div></div></section>
<section class="player card"><div class="row"><div class="avatar">🛡️</div><div class="grow"><div class="row"><strong>玩家總血量</strong><span id="turnText" class="tiny">第 1 回合</span></div><div class="bar"><div id="playerBar" class="fill playerfill"></div></div><div class="row tiny"><span id="playerText"></span><span id="shieldText">護盾 0</span></div></div></div></section>
<section class="boardcard card"><div class="row"><div><strong>下沉戰場</strong><div class="tiny">每放下一塊，所有方塊下沉 1 格</div></div><span id="overflowText" class="mode">沉沒傷害 0</span></div><div id="boardwrap" class="boardwrap"><div class="startline"><span>初始線</span></div><div class="bottomline"><span>沉沒線</span></div><div id="board" class="board"></div><div id="draglayer" class="draglayer"></div></div></section>
<section class="handcard card"><div class="row"><div><strong>玩家手牌</strong><div class="tiny">按住方塊，直接拖到戰場；點選後可旋轉</div></div><span id="selectedText" class="tiny">尚未選擇</span></div><div id="hand" class="hand"></div><div class="controls"><button id="rotate">↻ 旋轉選中方塊</button><button id="cancel" class="main">取消選擇</button></div></section>
<section class="rules card">同色三連線：對王造成傷害。藍色 2×2：增加玩家護盾。綠色十字：回復玩家總血量。方塊沉到最底部不會立刻結束，而是從棋盤移除並造成沉沒傷害。王每回合攻擊，第 4 回合發動重擊。</section>
<section class="logcard card"><strong>戰鬥紀錄</strong><div id="log" class="log"></div></section>
</main>
<div id="modal" class="modal hide"><div class="modalbox"><div id="modalEmoji" style="font-size:52px">🎉</div><h2 id="modalTitle"></h2><p id="modalText" class="tiny"></p><button id="again" class="wide">再玩一次</button></div></div>
<script>
(()=>{'use strict';
const ROWS=9,COLS=6,COLORS=['red','blue','green'],NAMES={red:'紅',blue:'藍',green:'綠'};
const SHAPES=[{n:'單格',c:[[0,0]]},{n:'雙格',c:[[0,0],[1,0]]},{n:'L形',c:[[0,0],[0,1],[1,1]]},{n:'直三',c:[[0,0],[1,0],[2,0]]},{n:'方形',c:[[0,0],[1,0],[0,1],[1,1]]},{n:'T形',c:[[0,0],[1,0],[2,0],[1,1]]}];
const $=id=>document.getElementById(id);let board,hand,selected,turn,bossHp,playerHp,shield,gameOver,drag;
function emptyBoard(){return Array.from({length:ROWS},()=>Array(COLS).fill(null))}
function cloneCells(c){return c.map(([x,y])=>[x,y])}
function norm(c){const minx=Math.min(...c.map(v=>v[0])),miny=Math.min(...c.map(v=>v[1]));return c.map(([x,y])=>[x-minx,y-miny])}
function rotateCells(c){return norm(c.map(([x,y])=>[-y,x]))}
function rand(n){return Math.floor(Math.random()*n)}
function newPiece(){const s=SHAPES[rand(SHAPES.length)],color=COLORS[rand(3)],marks=rand(3);const cells=cloneCells(s.c);const marked=new Set;while(marked.size<Math.min(marks,cells.length))marked.add(rand(cells.length));return{id:crypto.randomUUID?.()||Math.random(),name:s.n,color,cells,marked}}
function seed(){for(let x=0;x<COLS;x++){if(Math.random()<.72)board[0][x]={color:COLORS[rand(3)],mark:Math.random()<.18};}for(let x=0;x<COLS;x++){if(Math.random()<.28)board[1][x]={color:COLORS[rand(3)],mark:false};}}
function init(){board=emptyBoard();seed();hand=[newPiece(),newPiece(),newPiece()];selected=null;turn=1;bossHp=520;playerHp=220;shield=0;gameOver=false;drag=null;$('log').innerHTML='';addLog('戰鬥開始：初始方塊只會出現在最上方。');render()}
function render(){renderBoard();renderHand();$('bossBar').style.width=`${Math.max(0,bossHp/520*100)}%`;$('bossText').textContent=`HP ${Math.max(0,bossHp)} / 520`;$('playerBar').style.width=`${Math.max(0,playerHp/220*100)}%`;$('playerText').textContent=`HP ${Math.max(0,playerHp)} / 220`;$('shieldText').textContent=`護盾 ${shield}`;$('turnText').textContent=`第 ${turn} 回合`;$('bossMode').textContent=turn%4===0?'王之重擊':'普通攻擊';$('selectedText').textContent=selected==null?'尚未選擇':`${NAMES[hand[selected].color]}色・${hand[selected].name}`}
function renderBoard(){const el=$('board');el.innerHTML='';for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const d=document.createElement('div');d.className='cell';const v=board[y][x];if(v){d.classList.add('filled',v.color);if(v.mark){const p=document.createElement('span');p.className='paw';p.textContent='🐾';d.appendChild(p)}}el.appendChild(d)}}
function bounds(c){return{w:Math.max(...c.map(v=>v[0]))+1,h:Math.max(...c.map(v=>v[1]))+1}}
function renderHand(){const el=$('hand');el.innerHTML='';hand.forEach((p,i)=>{const b=bounds(p.cells),d=document.createElement('div');d.className='piece'+(i===selected?' selected':'');d.dataset.i=i;const mini=document.createElement('div');mini.className='mini';mini.style.gridTemplateColumns=`repeat(${b.w},22px)`;mini.style.gridTemplateRows=`repeat(${b.h},22px)`;for(let y=0;y<b.h;y++)for(let x=0;x<b.w;x++){const c=document.createElement('div'),idx=p.cells.findIndex(v=>v[0]===x&&v[1]===y);if(idx>=0){c.className=`minicell ${p.color}`;if(p.marked.has(idx))c.textContent='🐾'}mini.appendChild(c)}d.innerHTML=`<div class="tiny">${NAMES[p.color]}色・${p.name}</div>`;d.appendChild(mini);d.insertAdjacentHTML('beforeend','<div class="tiny">拖到棋盤放置</div>');d.addEventListener('pointerdown',e=>startDrag(e,i));d.addEventListener('click',()=>{selected=i;render()});el.appendChild(d)})}
function canPlace(p,gx,gy){return p.cells.every(([dx,dy])=>{const x=gx+dx,y=gy+dy;return x>=0&&x<COLS&&y>=0&&y<ROWS&&!board[y][x]})}
function place(i,gx,gy){const p=hand[i];if(!canPlace(p,gx,gy)){addLog('這個位置放不下。');return false}p.cells.forEach(([dx,dy],idx)=>board[gy+dy][gx+dx]={color:p.color,mark:p.marked.has(idx)});hand.splice(i,1);hand.push(newPiece());selected=null;resolvePatterns();sink();bossAttack();turn++;checkEnd();render();return true}
function startDrag(e,i){if(gameOver)return;selected=i;const p=hand[i];drag={id:e.pointerId,i};e.currentTarget.setPointerCapture?.(e.pointerId);showGhostFromPoint(e.clientX,e.clientY);window.addEventListener('pointermove',moveDrag,{passive:false});window.addEventListener('pointerup',endDrag,{once:true});render()}
function pointToGrid(cx,cy,p){const r=$('boardwrap').getBoundingClientRect(),cell=r.width/COLS,b=bounds(p.cells);return{x:Math.round((cx-r.left)/cell-b.w/2),y:Math.round((cy-r.top)/cell-b.h/2)}}
function showGhostFromPoint(cx,cy){if(!drag)return;const p=hand[drag.i],g=pointToGrid(cx,cy,p),layer=$('draglayer');layer.innerHTML='';const cell=$('boardwrap').clientWidth/COLS,ok=canPlace(p,g.x,g.y);p.cells.forEach(([dx,dy],idx)=>{const d=document.createElement('div');d.className=`ghostcell ${p.color}${ok?'':' bad'}`;d.style.left=`${(g.x+dx)*cell}px`;d.style.top=`${(g.y+dy)*cell}px`;if(p.marked.has(idx))d.textContent='🐾';layer.appendChild(d)});drag.g=g}
function moveDrag(e){if(!drag)return;e.preventDefault();showGhostFromPoint(e.clientX,e.clientY)}
function endDrag(e){window.removeEventListener('pointermove',moveDrag);$('draglayer').innerHTML='';if(drag?.g)place(drag.i,drag.g.x,drag.g.y);drag=null}
function resolvePatterns(){let dmg=0,addShield=0,heal=0;for(const color of COLORS){let marks=0,lines=0;for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const v=board[y][x];if(v?.color===color&&v.mark)marks++;if(x<=COLS-3&&[0,1,2].every(k=>board[y][x+k]?.color===color))lines++;if(y<=ROWS-3&&[0,1,2].every(k=>board[y+k][x]?.color===color))lines++}dmg+=lines*(10+marks*2);if(color==='blue')for(let y=0;y<ROWS-1;y++)for(let x=0;x<COLS-1;x++)if([[0,0],[1,0],[0,1],[1,1]].every(([dx,dy])=>board[y+dy][x+dx]?.color==='blue'))addShield+=10+marks;if(color==='green')for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++)if([[0,0],[1,0],[-1,0],[0,1],[0,-1]].every(([dx,dy])=>board[y+dy][x+dx]?.color==='green'))heal+=15+marks*2}
if(dmg){bossHp-=dmg;addLog(`同色連線造成 ${dmg} 點傷害。`)}if(addShield){shield=Math.min(120,shield+addShield);addLog(`藍色方陣增加 ${addShield} 護盾。`)}if(heal){const real=Math.min(220-playerHp,heal);playerHp+=real;addLog(`綠色十字回復 ${real} 血量。`)}}
function sink(){let lost=0;for(let x=0;x<COLS;x++)if(board[ROWS-1][x])lost++;for(let y=ROWS-1;y>0;y--)board[y]=board[y-1].map(v=>v?{...v}:null);board[0]=Array(COLS).fill(null);if(lost){const damage=lost*8;playerHp-=damage;$('overflowText').textContent=`沉沒傷害 ${damage}`;addLog(`${lost} 格方塊沉沒，玩家受到 ${damage} 傷害。`)}else $('overflowText').textContent='沉沒傷害 0'}
function bossAttack(){if(bossHp<=0)return;let damage=turn%4===0?34:14+rand(7);const name=turn%4===0?'王之重擊':'王的攻擊';const blocked=Math.min(shield,damage);shield-=blocked;damage-=blocked;playerHp-=damage;addLog(`${name}：護盾抵擋 ${blocked}，玩家受到 ${damage} 傷害。`)}
function checkEnd(){if(bossHp<=0)finish(true);else if(playerHp<=0)finish(false)}
function finish(win){gameOver=true;$('modal').classList.remove('hide');$('modalEmoji').textContent=win?'🏆':'💥';$('modalTitle').textContent=win?'擊敗沉沒之王':'玩家全隊倒下';$('modalText').textContent=win?`你在第 ${turn} 回合獲勝。`:'沉沒傷害與王的攻擊會扣除玩家總血量。'}
function addLog(t){const d=document.createElement('div');d.className='entry';d.textContent=t;$('log').prepend(d)}
$('rotate').onclick=()=>{if(selected==null)return addLog('請先選擇一張手牌。');hand[selected].cells=rotateCells(hand[selected].cells);render()};$('cancel').onclick=()=>{selected=null;$('draglayer').innerHTML='';render()};$('restart').onclick=init;$('again').onclick=()=>{$('modal').classList.add('hide');init()};init();
})();
</script></body></html>
