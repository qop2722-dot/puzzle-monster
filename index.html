<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#111827" />
  <title>拼圖怪獸戰場 v0.1</title>
  <style>
:root {
  --bg: #0b1020;
  --panel: rgba(17, 24, 39, 0.92);
  --panel-2: rgba(31, 41, 55, 0.94);
  --line: rgba(255,255,255,.11);
  --text: #f8fafc;
  --muted: #9ca3af;
  --red: #ef4444;
  --blue: #3b82f6;
  --green: #22c55e;
  --amber: #f59e0b;
  --cell: min(11.8vw, 56px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: radial-gradient(circle at top, #18233d 0, var(--bg) 48%); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; }
body { overscroll-behavior: none; }
button { font: inherit; color: inherit; }
.app-shell { width: min(100%, 620px); margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 14px max(28px, env(safe-area-inset-bottom)); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
h1 { font-size: 23px; margin: 1px 0 0; letter-spacing: .02em; }
.eyebrow, .tiny, .gesture-tip { color: var(--muted); font-size: 12px; }
.card { background: linear-gradient(180deg, rgba(31,41,55,.97), rgba(17,24,39,.97)); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 10px 28px rgba(0,0,0,.25); }
.ghost-btn { border: 1px solid var(--line); background: rgba(255,255,255,.04); border-radius: 12px; padding: 9px 12px; }
.enemy-panel { padding: 14px; margin-bottom: 10px; }
.enemy-row, .monster-head { display: flex; align-items: center; gap: 12px; }
.enemy-avatar { font-size: 42px; width: 52px; text-align: center; }
.enemy-info { flex: 1; }
.label-row, .board-head, .piece-meta, .stat-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hp-track, .shield-track { height: 10px; background: rgba(255,255,255,.08); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
.hp-track.small { height: 8px; }
.hp-fill, .shield-fill { height: 100%; width: 100%; border-radius: inherit; transition: width .25s ease; }
.hp-fill.enemy { background: linear-gradient(90deg, #f97316, #ef4444); }
.hp-fill.red { background: var(--red); }.hp-fill.green { background: var(--green); }.shield-fill { background: var(--blue); width: 0%; }
.status-strip { padding: 10px 12px; display: flex; justify-content: space-between; gap: 8px; font-size: 12px; margin-bottom: 10px; }
.status-dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; }.status-dot.red{background:var(--red)}.status-dot.blue{background:var(--blue)}.status-dot.green{background:var(--green)}
.board-card { padding: 12px; margin-bottom: 10px; }
.section-title { font-weight: 800; font-size: 15px; }
.danger-counter { color: #fecaca; background: rgba(239,68,68,.13); border: 1px solid rgba(239,68,68,.3); padding: 6px 9px; border-radius: 999px; font-size: 12px; }
.board-wrap { position: relative; width: calc(var(--cell) * 6); height: calc(var(--cell) * 8); margin: 12px auto 2px; touch-action: none; }
.board { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(6, var(--cell)); grid-template-rows: repeat(8, var(--cell)); background: rgba(2,6,23,.64); border: 2px solid rgba(255,255,255,.12); border-radius: 12px; overflow: hidden; }
.cell { position: relative; border-right: 1px solid rgba(255,255,255,.055); border-bottom: 1px solid rgba(255,255,255,.055); }
.cell.filled::before, .active-cell { content:""; position:absolute; inset:3px; border-radius:8px; box-shadow: inset 0 2px 0 rgba(255,255,255,.22), 0 4px 10px rgba(0,0,0,.22); }
.cell.red::before, .active-cell.red { background: linear-gradient(145deg,#fb7185,#dc2626); }
.cell.blue::before, .active-cell.blue { background: linear-gradient(145deg,#60a5fa,#2563eb); }
.cell.green::before, .active-cell.green { background: linear-gradient(145deg,#4ade80,#16a34a); }
.marker { position:absolute; z-index:3; left:50%; top:50%; transform:translate(-50%,-50%); font-size: calc(var(--cell) * .38); filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
.active-piece { position:absolute; inset:0; pointer-events:none; }
.active-cell { position:absolute; width:var(--cell); height:var(--cell); opacity:.9; border:2px solid rgba(255,255,255,.75); }
.danger-line { position:absolute; z-index:4; left:0; right:0; top:calc(var(--cell) * 6); border-top:2px dashed rgba(248,113,113,.88); pointer-events:none; }
.danger-line span { position:absolute; right:5px; top:-18px; color:#fca5a5; font-size:10px; background:#111827; padding:1px 4px; border-radius:4px; }
.piece-panel { padding: 12px; margin-bottom: 10px; }
.legend { color: var(--muted); font-size: 11px; text-align:right; }
.piece-preview { min-height: 72px; display:flex; align-items:center; justify-content:center; margin: 5px 0 10px; }
.preview-grid { display:grid; gap:4px; }
.preview-cell { width:28px; height:28px; border-radius:7px; display:grid; place-items:center; box-shadow: inset 0 2px 0 rgba(255,255,255,.2); }
.preview-cell.red{background:var(--red)}.preview-cell.blue{background:var(--blue)}.preview-cell.green{background:var(--green)}
.controls { display:grid; grid-template-columns: repeat(3, 1fr) 1.35fr; gap:8px; }
.controls button, .primary { min-height:48px; border:none; border-radius:14px; background: rgba(255,255,255,.08); font-size:20px; font-weight:800; }
.controls .primary, .primary { background: linear-gradient(135deg,#8b5cf6,#6366f1); }
.controls button:active, .primary:active { transform: translateY(1px) scale(.99); }
.gesture-tip { text-align:center; margin-top:8px; }
.team-grid { display:grid; gap:9px; margin-bottom:10px; }
.monster-card { padding:12px; }
.monster-emoji { font-size:30px; width:38px; text-align:center; }
.stat-row { font-size:12px; margin-top:9px; color:var(--muted); }
.log-card { padding:12px; }
.battle-log { max-height:150px; overflow:auto; margin-top:8px; display:flex; flex-direction:column; gap:6px; }
.log-entry { font-size:12px; color:#d1d5db; padding:7px 8px; border-radius:9px; background:rgba(255,255,255,.035); }
.log-entry strong { color:white; }
.modal { position:fixed; inset:0; z-index:20; display:grid; place-items:center; background:rgba(2,6,23,.78); backdrop-filter: blur(8px); padding:24px; }
.modal.hidden { display:none; }
.modal-card { width:min(100%,360px); background:#111827; border:1px solid var(--line); border-radius:22px; padding:24px; text-align:center; box-shadow:0 24px 70px rgba(0,0,0,.5); }
.modal-emoji { font-size:54px; }.modal-card h2{margin:8px 0}.modal-card p{color:var(--muted);line-height:1.6}.wide{width:100%;padding:13px;font-size:16px}
@media (min-width:560px){ :root{--cell:58px}.team-grid{grid-template-columns:repeat(3,1fr)}.monster-head{align-items:flex-start}.monster-card .tiny{font-size:11px} }

  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">手機測試版 v0.1</div>
        <h1>拼圖怪獸戰場</h1>
      </div>
      <button id="restartBtn" class="ghost-btn" type="button">重新開始</button>
    </header>

    <section class="enemy-panel card">
      <div class="enemy-row">
        <div class="enemy-avatar" aria-hidden="true">👾</div>
        <div class="enemy-info">
          <div class="label-row"><strong>訓練用巨獸</strong><span id="turnLabel">第 1 回合</span></div>
          <div class="hp-track"><div id="enemyHpBar" class="hp-fill enemy"></div></div>
          <div id="enemyHpText" class="tiny">HP 180 / 180</div>
        </div>
      </div>
    </section>

    <section class="status-strip card">
      <div><span class="status-dot red"></span>紅：攻擊</div>
      <div><span class="status-dot blue"></span>藍：防禦</div>
      <div><span class="status-dot green"></span>綠：技能</div>
    </section>

    <section class="board-card card">
      <div class="board-head">
        <div>
          <div class="section-title">戰場</div>
          <div class="tiny">每回合開始，既有方塊下降 1 格</div>
        </div>
        <div id="dangerCount" class="danger-counter">危險 0 / 3</div>
      </div>
      <div id="boardWrap" class="board-wrap">
        <div id="dangerLine" class="danger-line"><span>危險線</span></div>
        <div id="board" class="board" aria-label="遊戲棋盤"></div>
        <div id="activePiece" class="active-piece" aria-hidden="true"></div>
      </div>
    </section>

    <section class="piece-panel card">
      <div class="piece-meta">
        <div>
          <div class="section-title">本回合方塊</div>
          <div id="pieceInfo" class="tiny">隨機形狀、顏色與怪獸標記</div>
        </div>
        <div class="legend"><span>🐾</span> 標記會放大觸發效果</div>
      </div>
      <div id="piecePreview" class="piece-preview"></div>
      <div class="controls">
        <button id="leftBtn" type="button" aria-label="向左">←</button>
        <button id="rotateBtn" type="button" aria-label="旋轉">↻</button>
        <button id="rightBtn" type="button" aria-label="向右">→</button>
        <button id="placeBtn" class="primary" type="button">放下</button>
      </div>
      <div class="gesture-tip">也可以在戰場上左右滑動，向上滑旋轉，向下滑放下。</div>
    </section>

    <section class="team-grid">
      <article class="monster-card card red-card">
        <div class="monster-head"><span class="monster-emoji">🦊</span><div><strong>焰尾狐</strong><div class="tiny">紅色直線發動攻擊</div></div></div>
        <div class="stat-row"><span>生命</span><span id="redHpText">60 / 60</span></div>
        <div class="hp-track small"><div id="redHpBar" class="hp-fill red"></div></div>
      </article>
      <article class="monster-card card blue-card">
        <div class="monster-head"><span class="monster-emoji">🐢</span><div><strong>潮甲龜</strong><div class="tiny">藍色方形獲得護盾</div></div></div>
        <div class="stat-row"><span>護盾</span><span id="shieldText">0</span></div>
        <div class="shield-track"><div id="shieldBar" class="shield-fill"></div></div>
      </article>
      <article class="monster-card card green-card">
        <div class="monster-head"><span class="monster-emoji">🐰</span><div><strong>芽露兔</strong><div class="tiny">綠色十字發動治療</div></div></div>
        <div class="stat-row"><span>生命</span><span id="greenHpText">55 / 55</span></div>
        <div class="hp-track small"><div id="greenHpBar" class="hp-fill green"></div></div>
      </article>
    </section>

    <section class="log-card card">
      <div class="section-title">戰鬥紀錄</div>
      <div id="battleLog" class="battle-log" aria-live="polite"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div id="modalEmoji" class="modal-emoji">🎉</div>
      <h2 id="modalTitle">勝利</h2>
      <p id="modalText"></p>
      <button id="modalRestartBtn" class="primary wide" type="button">再玩一次</button>
    </div>
  </div>

  <script>
(() => {
  'use strict';

  const ROWS = 8;
  const COLS = 6;
  const DANGER_ROW = 6;
  const COLORS = ['red', 'blue', 'green'];
  const COLOR_NAMES = { red: '紅色', blue: '藍色', green: '綠色' };
  const SHAPES = [
    { name: '單格', cells: [[0,0]] },
    { name: '雙格', cells: [[0,0],[1,0]] },
    { name: 'L 型', cells: [[0,0],[0,1],[1,1]] },
    { name: 'T 型', cells: [[0,0],[1,0],[2,0],[1,1]] },
    { name: '方形', cells: [[0,0],[1,0],[0,1],[1,1]] },
    { name: '長條', cells: [[0,0],[1,0],[2,0]] }
  ];

  const state = {
    board: [],
    active: null,
    turn: 1,
    enemyHp: 180,
    enemyMaxHp: 180,
    redHp: 60,
    redMaxHp: 60,
    greenHp: 55,
    greenMaxHp: 55,
    shield: 0,
    danger: 0,
    gameOver: false,
    matchedKeys: new Set()
  };

  const $ = (id) => document.getElementById(id);
  const boardEl = $('board');
  const activePieceEl = $('activePiece');
  const piecePreviewEl = $('piecePreview');
  const battleLogEl = $('battleLog');

  function emptyBoard() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  }

  function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function rotateCells(cells) {
    const rotated = cells.map(([x,y]) => [-y, x]);
    const minX = Math.min(...rotated.map(c => c[0]));
    const minY = Math.min(...rotated.map(c => c[1]));
    return rotated.map(([x,y]) => [x - minX, y - minY]);
  }

  function normalizePiece(piece) {
    const maxX = Math.max(...piece.cells.map(c => c[0]));
    const maxY = Math.max(...piece.cells.map(c => c[1]));
    piece.width = maxX + 1;
    piece.height = maxY + 1;
  }

  function createRandomPiece() {
    const shape = rand(SHAPES);
    const color = rand(COLORS);
    const cells = shape.cells.map(([x,y], index) => ({
      x, y,
      marker: Math.random() < 0.3 ? 1 : 0,
      markerIndex: index
    }));
    if (Math.random() < 0.12 && cells.length > 1) {
      const unmarked = cells.filter(c => !c.marker);
      if (unmarked.length) rand(unmarked).marker = 1;
    }
    const piece = { name: shape.name, color, cells, x: 2, y: 0 };
    normalizePiece(piece);
    piece.x = Math.floor((COLS - piece.width) / 2);
    return piece;
  }

  function initBoard() {
    state.board = emptyBoard();
    const seedCount = 8 + Math.floor(Math.random() * 5);
    const candidates = [];
    for (let r = 0; r < 4; r++) for (let c = 0; c < COLS; c++) candidates.push([r,c]);
    for (let i = candidates.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
    }
    candidates.slice(0, seedCount).forEach(([r,c]) => {
      state.board[r][c] = { color: rand(COLORS), marker: Math.random() < .18 ? 1 : 0 };
    });
  }

  function resetGame() {
    state.turn = 1;
    state.enemyHp = state.enemyMaxHp;
    state.redHp = state.redMaxHp;
    state.greenHp = state.greenMaxHp;
    state.shield = 0;
    state.danger = 0;
    state.gameOver = false;
    state.matchedKeys = new Set();
    battleLogEl.innerHTML = '';
    initBoard();
    spawnPiece();
    addLog('<strong>戰鬥開始！</strong>先觀察開場方塊，再決定要強化哪隻怪獸。');
    $('modal').classList.add('hidden');
    renderAll();
  }

  function spawnPiece() {
    state.active = createRandomPiece();
    if (!canOccupy(state.active.x, state.active.y, state.active.cells)) {
      state.danger++;
      addLog('新方塊沒有空間出現，危險值 +1。');
      clearTopRows();
    }
  }

  function clearTopRows() {
    state.board[0] = Array(COLS).fill(null);
    state.board[1] = Array(COLS).fill(null);
  }

  function canOccupy(px, py, cells) {
    return cells.every(cell => {
      const x = px + cell.x;
      const y = py + cell.y;
      return x >= 0 && x < COLS && y >= 0 && y < ROWS && !state.board[y][x];
    });
  }

  function moveActive(dx) {
    if (state.gameOver) return;
    const nx = state.active.x + dx;
    if (canOccupy(nx, state.active.y, state.active.cells)) {
      state.active.x = nx;
      renderActive();
    }
  }

  function rotateActive() {
    if (state.gameOver) return;
    const rotatedCoords = rotateCells(state.active.cells.map(c => [c.x,c.y]));
    const rotated = state.active.cells.map((cell, i) => ({ ...cell, x: rotatedCoords[i][0], y: rotatedCoords[i][1] }));
    const oldCells = state.active.cells;
    state.active.cells = rotated;
    normalizePiece(state.active);
    state.active.x = clamp(state.active.x, 0, COLS - state.active.width);
    if (!canOccupy(state.active.x, state.active.y, state.active.cells)) {
      state.active.cells = oldCells;
      normalizePiece(state.active);
    }
    renderAll();
  }

  function placeActive() {
    if (state.gameOver) return;
    let targetY = 0;
    while (canOccupy(state.active.x, targetY + 1, state.active.cells)) targetY++;
    if (!canOccupy(state.active.x, targetY, state.active.cells)) {
      state.danger++;
      addLog('方塊無法放置，危險值 +1。');
      endTurn();
      return;
    }
    state.active.y = targetY;
    state.active.cells.forEach(cell => {
      state.board[targetY + cell.y][state.active.x + cell.x] = { color: state.active.color, marker: cell.marker };
    });
    addLog(`放下${COLOR_NAMES[state.active.color]}「${state.active.name}」。`);
    resolvePatterns();
    if (!state.gameOver) enemyAction();
    if (!state.gameOver) endTurn();
  }

  function endTurn() {
    if (checkEnd()) return;
    state.turn++;
    descendBoard();
    if (checkEnd()) return;
    spawnPiece();
    renderAll();
  }

  function descendBoard() {
    let overflow = false;
    for (let c = 0; c < COLS; c++) if (state.board[ROWS - 1][c]) overflow = true;
    for (let r = ROWS - 1; r > 0; r--) state.board[r] = state.board[r - 1].map(v => v ? { ...v } : null);
    state.board[0] = Array(COLS).fill(null);
    if (overflow) {
      state.danger++;
      addLog('<strong>方塊沉到最底部！</strong>危險值 +1。');
      state.board[ROWS - 1] = Array(COLS).fill(null);
    }
  }

  function getMarkerCount(coords) {
    return coords.reduce((sum,[r,c]) => sum + (state.board[r][c]?.marker || 0), 0);
  }

  function resolvePatterns() {
    const found = [];

    // horizontal/vertical 3+ lines
    COLORS.forEach(color => {
      for (let r = 0; r < ROWS; r++) {
        let start = 0;
        while (start < COLS) {
          if (state.board[r][start]?.color !== color) { start++; continue; }
          let end = start + 1;
          while (end < COLS && state.board[r][end]?.color === color) end++;
          if (end - start >= 3) {
            const coords = Array.from({length:end-start},(_,i)=>[r,start+i]);
            found.push({ type:'line', color, coords });
          }
          start = end;
        }
      }
      for (let c = 0; c < COLS; c++) {
        let start = 0;
        while (start < ROWS) {
          if (state.board[start][c]?.color !== color) { start++; continue; }
          let end = start + 1;
          while (end < ROWS && state.board[end][c]?.color === color) end++;
          if (end - start >= 3) {
            const coords = Array.from({length:end-start},(_,i)=>[start+i,c]);
            found.push({ type:'line', color, coords });
          }
          start = end;
        }
      }
    });

    // 2x2 squares
    for (let r=0;r<ROWS-1;r++) for (let c=0;c<COLS-1;c++) {
      const cells=[[r,c],[r,c+1],[r+1,c],[r+1,c+1]];
      const color=state.board[r][c]?.color;
      if (color && cells.every(([rr,cc])=>state.board[rr][cc]?.color===color)) found.push({type:'square',color,coords:cells});
    }

    // crosses
    for (let r=1;r<ROWS-1;r++) for (let c=1;c<COLS-1;c++) {
      const cells=[[r,c],[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
      const color=state.board[r][c]?.color;
      if (color && cells.every(([rr,cc])=>state.board[rr][cc]?.color===color)) found.push({type:'cross',color,coords:cells});
    }

    const unique = found.filter(pattern => {
      const key = `${pattern.type}:${pattern.color}:${pattern.coords.map(x=>x.join(',')).sort().join('|')}`;
      if (state.matchedKeys.has(key)) return false;
      state.matchedKeys.add(key);
      return true;
    });

    if (!unique.length) addLog('沒有完成新圖形。');
    unique.forEach(applyPattern);
  }

  function applyPattern(pattern) {
    const markers = getMarkerCount(pattern.coords);
    const multiplier = 1 + markers * .5;
    if (pattern.type === 'line') {
      const damage = Math.round((10 + Math.max(0, pattern.coords.length - 3) * 4) * multiplier);
      state.enemyHp = Math.max(0, state.enemyHp - damage);
      addLog(`${COLOR_NAMES[pattern.color]}直線完成，造成 <strong>${damage}</strong> 傷害${markers ? `（🐾×${markers}）` : ''}。`);
    } else if (pattern.type === 'square') {
      const gain = Math.round(12 * multiplier);
      state.shield = Math.min(60, state.shield + gain);
      addLog(`${COLOR_NAMES[pattern.color]}方形完成，獲得 <strong>${gain}</strong> 護盾${markers ? `（🐾×${markers}）` : ''}。`);
    } else if (pattern.type === 'cross') {
      const heal = Math.round(14 * multiplier);
      state.redHp = Math.min(state.redMaxHp, state.redHp + heal);
      state.greenHp = Math.min(state.greenMaxHp, state.greenHp + heal);
      addLog(`${COLOR_NAMES[pattern.color]}十字完成，全隊恢復 <strong>${heal}</strong> 生命${markers ? `（🐾×${markers}）` : ''}。`);
    }
  }

  function enemyAction() {
    if (state.enemyHp <= 0) return;
    let damage = 9 + Math.floor(Math.random() * 7);
    if (state.shield > 0) {
      const blocked = Math.min(state.shield, damage);
      state.shield -= blocked;
      damage -= blocked;
      addLog(`潮甲龜的護盾抵擋 <strong>${blocked}</strong> 傷害。`);
    }
    if (damage > 0) {
      const target = Math.random() < .55 ? 'red' : 'green';
      if (target === 'red') state.redHp = Math.max(0, state.redHp - damage);
      else state.greenHp = Math.max(0, state.greenHp - damage);
      addLog(`敵人攻擊${target === 'red' ? '焰尾狐' : '芽露兔'}，造成 <strong>${damage}</strong> 傷害。`);
    }
  }

  function checkEnd() {
    if (state.enemyHp <= 0) { showEnd(true, '你利用圖形加成擊敗了訓練用巨獸。'); return true; }
    if (state.danger >= 3 || (state.redHp <= 0 && state.greenHp <= 0)) {
      showEnd(false, state.danger >= 3 ? '戰場沉到底部三次，防線崩潰。' : '隊伍失去戰鬥能力。');
      return true;
    }
    return false;
  }

  function showEnd(win, text) {
    state.gameOver = true;
    $('modalEmoji').textContent = win ? '🏆' : '💥';
    $('modalTitle').textContent = win ? '測試勝利' : '測試失敗';
    $('modalText').textContent = `${text} 共進行 ${state.turn} 回合。`;
    $('modal').classList.remove('hidden');
    renderAll();
  }

  function addLog(html) {
    const item = document.createElement('div');
    item.className = 'log-entry';
    item.innerHTML = html;
    battleLogEl.prepend(item);
    while (battleLogEl.children.length > 18) battleLogEl.lastChild.remove();
  }

  function renderBoard() {
    boardEl.innerHTML = '';
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const value = state.board[r][c];
      if (value) {
        cell.classList.add('filled', value.color);
        if (value.marker) {
          const marker = document.createElement('span'); marker.className='marker'; marker.textContent='🐾'; cell.appendChild(marker);
        }
      }
      boardEl.appendChild(cell);
    }
  }

  function renderActive() {
    activePieceEl.innerHTML='';
    if (!state.active || state.gameOver) return;
    state.active.cells.forEach(cell => {
      const div=document.createElement('div');
      div.className=`active-cell ${state.active.color}`;
      div.style.left=`calc(var(--cell) * ${state.active.x + cell.x})`;
      div.style.top=`calc(var(--cell) * ${cell.y})`;
      if(cell.marker){const marker=document.createElement('span');marker.className='marker';marker.textContent='🐾';div.appendChild(marker)}
      activePieceEl.appendChild(div);
    });
  }

  function renderPreview() {
    piecePreviewEl.innerHTML='';
    if(!state.active) return;
    const grid=document.createElement('div'); grid.className='preview-grid';
    grid.style.gridTemplateColumns=`repeat(${state.active.width}, 28px)`;
    grid.style.gridTemplateRows=`repeat(${state.active.height}, 28px)`;
    const map=new Map(state.active.cells.map(c=>[`${c.x},${c.y}`,c]));
    for(let y=0;y<state.active.height;y++) for(let x=0;x<state.active.width;x++){
      const d=document.createElement('div');
      const cell=map.get(`${x},${y}`);
      if(cell){d.className=`preview-cell ${state.active.color}`;if(cell.marker)d.textContent='🐾'}
      grid.appendChild(d);
    }
    piecePreviewEl.appendChild(grid);
    const markerCount=state.active.cells.reduce((s,c)=>s+c.marker,0);
    $('pieceInfo').textContent=`${COLOR_NAMES[state.active.color]}・${state.active.name}・🐾 ${markerCount}`;
  }

  function renderStats() {
    $('turnLabel').textContent=`第 ${state.turn} 回合`;
    $('enemyHpText').textContent=`HP ${state.enemyHp} / ${state.enemyMaxHp}`;
    $('enemyHpBar').style.width=`${state.enemyHp/state.enemyMaxHp*100}%`;
    $('redHpText').textContent=`${state.redHp} / ${state.redMaxHp}`;
    $('redHpBar').style.width=`${state.redHp/state.redMaxHp*100}%`;
    $('greenHpText').textContent=`${state.greenHp} / ${state.greenMaxHp}`;
    $('greenHpBar').style.width=`${state.greenHp/state.greenMaxHp*100}%`;
    $('shieldText').textContent=state.shield;
    $('shieldBar').style.width=`${Math.min(100,state.shield/60*100)}%`;
    $('dangerCount').textContent=`危險 ${state.danger} / 3`;
  }

  function renderAll(){ renderBoard(); renderActive(); renderPreview(); renderStats(); }

  $('leftBtn').addEventListener('click',()=>moveActive(-1));
  $('rightBtn').addEventListener('click',()=>moveActive(1));
  $('rotateBtn').addEventListener('click',rotateActive);
  $('placeBtn').addEventListener('click',placeActive);
  $('restartBtn').addEventListener('click',resetGame);
  $('modalRestartBtn').addEventListener('click',resetGame);

  let touchStart=null;
  $('boardWrap').addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchStart={x:t.clientX,y:t.clientY};},{passive:true});
  $('boardWrap').addEventListener('touchend',e=>{
    if(!touchStart)return;const t=e.changedTouches[0];const dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;touchStart=null;
    if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
    if(Math.abs(dx)>Math.abs(dy)) moveActive(dx>0?1:-1);
    else if(dy<-20) rotateActive(); else placeActive();
  },{passive:true});

  resetGame();
})();

  </script>
</body>
</html>
